name = "recibos-proxy"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Variables NO secretas. Los secretos (GEMINI_API_KEY, APP_PASSWORD,
# APP_AUTH_SECRET) se cargan aparte con `wrangler secret put ...` — NO van
# aquí ni en el repo.
[vars]
# Fijamos la versión concreta (en vez del alias "gemini-flash-latest") para
# evitar los 503 de sobrecarga que da el alias en horas pico.
GEMINI_MODEL = "gemini-3.6-flash"
# Restringe el origen si quieres (ej. "https://tu-app.pages.dev"); '*' está bien
# porque la protección real es el token compartido.
ALLOWED_ORIGIN = "*"
